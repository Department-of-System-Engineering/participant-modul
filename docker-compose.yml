services:
  participant-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: participant_modul
    volumes:
      - participant_postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - shared-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  participant-backend:
    build: .
    ports:
      - "8090:8090"
    depends_on:
      participant-db:
        condition: service_healthy
    networks:
      - shared-network

networks:
  shared-network:
    external: true

volumes:
  participant_postgres_data:
